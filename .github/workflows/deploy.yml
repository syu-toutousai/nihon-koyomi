name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 15 1 3 *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 祝日CSVの更新取得（失敗時はリポジトリ内の既存データを使用）
        continue-on-error: true
        run: curl -fsSL -o data/syukujitsu.csv https://www8.cao.go.jp/chosei/shukujitsu/syukujitsu.csv
      - name: 暦データ生成
        run: node scripts/build-data.mjs
      - name: 国立天文台暦要項との突合検証
        run: node scripts/verify.mjs
      - name: 印刷用HTML・PDF生成
        run: node scripts/build-print.mjs --pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
